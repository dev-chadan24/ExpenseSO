{% extends 'base.html' %}

{% block title %}Delete Category{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-xl-5 col-lg-7 col-md-9">
        <div class="card-premium border-danger">
            <div class="text-center mb-4">
                <div class="stat-icon-wrapper stat-icon-danger rounded-circle mx-auto mb-3" style="width: 60px; height: 60px;">
                    <i class="fas fa-trash-can fa-lg"></i>
                </div>
                <h2 class="m-0 text-xl font-outfit text-danger">Delete Category?</h2>
                <p class="text-sm text-secondary mt-1">This action cannot be undone. Associated transactions will not be deleted, but they will be marked as "Uncategorized".</p>
            </div>
            
            <div class="card-premium bg-secondary bg-opacity-10 p-3 mb-4 text-center">
                <div class="stat-icon-wrapper rounded-circle mx-auto mb-2" style="background-color: {{ category.color }}15; color: {{ category.color }}; width: 48px; height: 48px;">
                    <i class="fas {{ category.icon|default:'fa-ellipsis-h' }}"></i>
                </div>
                <h4 class="text-md fw-bold m-0" style="color: {{ category.color }};">{{ category.name }}</h4>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex gap-3">
                    <a href="{% url 'category-list' %}" class="btn-premium btn-premium-secondary w-50 justify-content-center">
                        No, Keep it
                    </a>
                    <button type="submit" class="btn-premium btn-premium-danger w-50 justify-content-center">
                        Yes, Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
