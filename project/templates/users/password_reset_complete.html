{% extends 'base.html' %}

{% block title %}Reset Complete{% endblock %}

{% block content %}
<div class="auth-wrapper align-items-center justify-content-center">
    <div class="auth-card">
        <div class="card-premium glass-panel text-center p-5 shadow-xl">
            <div class="stat-icon-wrapper rounded-circle mx-auto mb-3" style="background-color: rgba(16, 185, 129, 0.1); color: var(--success); width: 64px; height: 64px;">
                <i class="fas fa-circle-check fa-lg"></i>
            </div>
            
            <h3 class="font-outfit fw-bold mb-2">Password Changed</h3>
            <p class="text-sm text-secondary mb-4">Your password has been successfully reset and updated. You can now log in using your new credentials.</p>
            
            <a href="{% url 'login' %}" class="btn-premium btn-premium-primary w-100 justify-content-center py-2">
                Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
