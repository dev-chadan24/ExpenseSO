{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-wrapper align-items-center justify-content-center">
    <div class="auth-card">
        <div class="card-premium glass-panel p-4 shadow-xl">
            <h3 class="font-outfit fw-bold mb-2">Reset Password</h3>
            <p class="text-sm text-secondary mb-4">Enter your registered email address and we'll send you instructions to reset your password.</p>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group-premium mb-4">
                    <label class="form-label-premium" for="id_email">Email Address</label>
                    <input type="email" name="email" id="id_email" class="form-control-premium" required placeholder="Enter your email address">
                </div>
                
                <button type="submit" class="btn-premium btn-premium-primary w-100 justify-content-center py-2 mb-3">
                    Send Reset Link
                </button>
                
                <div class="text-center text-xs text-secondary mt-3">
                    Back to <a href="{% url 'login' %}" class="fw-bold text-decoration-none">Sign In</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
